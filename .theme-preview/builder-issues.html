<script>
  (function() {
    var residentPath = '/resident/';
    var residentLabel = '\u9996\u9801';
    var search = window.location.search || '';
    var referrer = document.referrer || '';
    var hasResidentSession = false;
    var isMobileWidth = false;

    try {
      hasResidentSession = sessionStorage.getItem('residentPwaContext') === '1';
    } catch (e) {}

    if (window.matchMedia) {
      isMobileWidth = window.matchMedia('(max-width: 640px)').matches;
    }

    var cameFromResident =
      /back_url=(%2F|\/)resident/i.test(search) ||
      referrer.indexOf('/resident') !== -1 ||
      hasResidentSession ||
      isMobileWidth;

    if (!cameFromResident) return;

    try {
      sessionStorage.setItem('residentPwaContext', '1');
    } catch (e) {}

    function isRootHomeLink(link) {
      if (!link) return false;
      var href = link.getAttribute('href');
      return href === '/' || href === window.location.origin + '/';
    }

    function rewriteResidentHomeLinks(root) {
      var scope = root || document;
      scope.querySelectorAll('a.home, a[href="/"]').forEach(function(link) {
        if (!isRootHomeLink(link) && !link.classList.contains('home')) return;
        link.href = residentPath;
        if (link.classList.contains('home') || link.textContent.trim().toLowerCase() === 'home') {
          link.textContent = residentLabel;
        }
      });
    }

    rewriteResidentHomeLinks(document);

    document.addEventListener('click', function(event) {
      var link = event.target.closest && event.target.closest('a');
      if (!isRootHomeLink(link)) return;

      event.preventDefault();
      window.location.href = residentPath;
    }, true);

    if (window.MutationObserver) {
      new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.nodeType === 1) rewriteResidentHomeLinks(node);
          });
        });
      }).observe(document.body, { childList: true, subtree: true });
    }

    var headerTitle = document.querySelector('#header h1');
    if (headerTitle) {
      headerTitle.style.cursor = 'pointer';
      headerTitle.addEventListener('click', function() {
        window.location.href = residentPath;
      });
    }
  })();
</script>
